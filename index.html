<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كبس كبس حبيبي</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Tahoma,sans-serif;
    background:#f3f4f6;
    color:#111827;
    min-height:100vh;
}

.top{
    text-align:center;
    padding:22px 10px 5px;
    font-size:15px;
    color:#555;
}

.container{
    width:92%;
    max-width:650px;
    margin:auto;
    padding:25px 0 40px;
}

.hero{
    text-align:center;
    margin-bottom:25px;
}

.hero h1{
    font-size:38px;
    margin-bottom:8px;
}

.hero p{
    color:#666;
    font-size:14px;
}

.card{
    background:#fff;
    border:1px solid #ddd;
    border-radius:16px;
    padding:20px;
}

.field{
    margin-bottom:16px;
}

label{
    display:block;
    font-size:14px;
    font-weight:bold;
    margin-bottom:7px;
}

input,
textarea{
    width:100%;
    padding:13px;
    border:1px solid #ccc;
    border-radius:10px;
    background:#fff;
    color:#111;
    font-size:15px;
    outline:none;
}

input:focus,
textarea:focus{
    border-color:#555;
}

textarea{
    min-height:180px;
    resize:vertical;
}

.counter{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#f7f7f7;
    border:1px solid #ddd;
    border-radius:10px;
    padding:13px;
    margin:18px 0;
}

.counter-title{
    font-size:12px;
    color:#666;
}

.counter-number{
    font-size:25px;
    font-weight:bold;
    margin-top:3px;
}

.counter-buttons{
    display:flex;
    gap:7px;
}

.small-btn{
    width:40px;
    height:40px;
    border:1px solid #ccc;
    border-radius:8px;
    background:#fff;
    color:#111;
    font-size:20px;
    cursor:pointer;
}

.buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.action{
    border:0;
    border-radius:10px;
    padding:14px;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
    color:#fff;
}

.send{
    background:#111827;
}

.copy{
    background:#2563eb;
}

.save{
    background:#16835c;
}

.clear{
    background:#dc3545;
}

.note{
    margin-top:15px;
    padding:12px;
    background:#f7f7f7;
    border:1px solid #ddd;
    border-radius:10px;
    color:#666;
    font-size:12px;
    line-height:1.7;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-top:12px;
}

.stat{
    text-align:center;
    padding:11px 5px;
    background:#f7f7f7;
    border:1px solid #ddd;
    border-radius:10px;
}

.stat b{
    display:block;
    font-size:16px;
    margin-bottom:4px;
}

.stat span{
    font-size:10px;
    color:#777;
}

footer{
    text-align:center;
    color:#777;
    font-size:12px;
    padding-top:20px;
}

.theme{
    position:fixed;
    left:15px;
    bottom:15px;
    width:42px;
    height:42px;
    border:1px solid #ccc;
    border-radius:50%;
    background:#fff;
    cursor:pointer;
    font-size:17px;
}

.toast{
    position:fixed;
    bottom:70px;
    right:50%;
    transform:translateX(50%);
    background:#111827;
    color:#fff;
    padding:10px 16px;
    border-radius:8px;
    font-size:13px;
    display:none;
}

.toast.show{
    display:block;
}

@media(max-width:550px){
    .hero h1{
        font-size:32px;
    }

    .buttons{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="top">
    © علي رضا
</div>

<div class="container">

    <div class="hero">
        <h1>كبس كبس حبيبي</h1>
        <p>جهّز رسالتك واضغط الزر</p>
    </div>

    <div class="card">

        <div class="field">
            <label>إيميل الدعم</label>
            <input id="email" type="email" placeholder="example@domain.com">
        </div>

        <div class="field">
            <label>الموضوع</label>
            <input id="subject" type="text" placeholder="اكتب الموضوع">
        </div>

        <div class="field">
            <label>نص الرسالة</label>
            <textarea id="message" placeholder="اكتب رسالتك هنا..."></textarea>
        </div>

        <div class="counter">
            <div>
                <div class="counter-title">عدد مرات الكبس</div>
                <div class="counter-number" id="reportCount">0</div>
            </div>

            <div class="counter-buttons">
                <button class="small-btn" id="minus">−</button>
                <button class="small-btn" id="plus">+</button>
            </div>
        </div>

        <div class="buttons">
            <button class="action send" id="sendMail">كبس كبس</button>
            <button class="action copy" id="copy">نسخ</button>
            <button class="action save" id="save">حفظ</button>
            <button class="action clear" id="clear">مسح</button>
        </div>

        <div class="note">
            البيانات محفوظة داخل المتصفح فقط. زر «كبس كبس» يفتح تطبيق البريد عندك مع تجهيز الرسالة، وبعدها تضغط إرسال بنفسك.
        </div>

        <div class="stats">
            <div class="stat">
                <b id="chars">0</b>
                <span>حرف</span>
            </div>

            <div class="stat">
                <b id="words">0</b>
                <span>كلمة</span>
            </div>

            <div class="stat">
                <b id="state">جاهز</b>
                <span>الحالة</span>
            </div>
        </div>

    </div>

    <footer>
        © علي رضا
    </footer>

</div>

<button class="theme" id="theme">☀️</button>

<div class="toast" id="toast"></div>

<script>
const email = document.getElementById("email");
const subject = document.getElementById("subject");
const message = document.getElementById("message");
const countEl = document.getElementById("reportCount");
const chars = document.getElementById("chars");
const words = document.getElementById("words");
const state = document.getElementById("state");
const toast = document.getElementById("toast");

let count = Number(
    localStorage.getItem("support_report_count") || 0
);

function showToast(text){
    toast.textContent = text;
    toast.classList.add("show");

    setTimeout(function(){
        toast.classList.remove("show");
    },1800);
}

function updateCounter(){
    countEl.textContent = count;
    localStorage.setItem("support_report_count",count);
}

function updateStats(){
    const text = message.value.trim();

    chars.textContent = message.value.length;
    words.textContent = text
        ? text.split(/\s+/).length
        : 0;
}

function saveData(show){
    localStorage.setItem(
        "support_form_data",
        JSON.stringify({
            email:email.value,
            subject:subject.value,
            message:message.value
        })
    );

    if(show){
        showToast("تم الحفظ");
    }
}

function loadData(){
    try{
        const data = JSON.parse(
            localStorage.getItem("support_form_data") || "{}"
        );

        email.value = data.email || "";
        subject.value = data.subject || "";
        message.value = data.message || "";
    }catch(e){}

    updateCounter();
    updateStats();
}

function buildMail(){
    const to = email.value.trim();
    const sub = subject.value.trim();
    const msg = message.value.trim();

    if(!to){
        showToast("اكتب إيميل الدعم");
        email.focus();
        return null;
    }

    if(!msg){
        showToast("اكتب نص الرسالة");
        message.focus();
        return null;
    }

    return "mailto:" +
        encodeURIComponent(to) +
        "?subject=" +
        encodeURIComponent(sub) +
        "&body=" +
        encodeURIComponent(msg);
}

document.getElementById("sendMail").onclick = function(){

    const mail = buildMail();

    if(!mail) return;

    saveData(false);

    count++;
    updateCounter();

    state.textContent = "تم الفتح";

    window.location.href = mail;
};

document.getElementById("copy").onclick = async function(){

    const text =
        "الإيميل: " + email.value +
        "\nالموضوع: " + subject.value +
        "\n\n" + message.value;

    try{
        await navigator.clipboard.writeText(text);
        showToast("تم النسخ");
    }catch(e){
        showToast("تعذر النسخ");
    }
};

document.getElementById("save").onclick = function(){
    saveData(true);
    state.textContent = "محفوظ";
};

document.getElementById("clear").onclick = function(){

    email.value = "";
    subject.value = "";
    message.value = "";

    localStorage.removeItem("support_form_data");

    updateStats();
    state.textContent = "جاهز";

    showToast("تم المسح");
};

document.getElementById("plus").onclick = function(){
    count++;
    updateCounter();
};

document.getElementById("minus").onclick = function(){
    if(count > 0){
        count--;
    }

    updateCounter();
};

[email,subject,message].forEach(function(el){

    el.addEventListener("input",function(){
        updateStats();
        saveData(false);
        state.textContent = "محفوظ تلقائيًا";
    });

});

const theme = document.getElementById("theme");

theme.onclick = function(){

    if(document.body.style.background === "rgb(17, 24, 39)"){

        document.body.style.background = "#f3f4f6";
        document.body.style.color = "#111827";
        theme.textContent = "☀️";

        localStorage.setItem(
            "support_theme",
            "light"
        );

    }else{

        document.body.style.background = "#111827";
        document.body.style.color = "#ffffff";
        theme.textContent = "🌙";

        localStorage.setItem(
            "support_theme",
            "dark"
        );
    }
};

if(localStorage.getItem("support_theme") === "dark"){
    document.body.style.background = "#111827";
    document.body.style.color = "#ffffff";
    theme.textContent = "🌙";
}

loadData();
</script>

</body>
</html>
