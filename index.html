<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>كبس كبس حبيبي</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0
}

body{
font-family:Arial,Tahoma,sans-serif;
background:#080b12;
color:#fff;
min-height:100vh
}

.top{
text-align:center;
padding:22px 10px 8px;
font-size:15px;
color:#aaa
}

.container{
width:92%;
max-width:700px;
margin:auto;
padding:20px 0 40px
}

.hero{
text-align:center;
padding:15px 0 25px
}

.hero h1{
font-size:40px;
font-weight:900;
color:#fff;
margin-bottom:8px
}

.hero p{
color:#999;
font-size:14px
}

.card{
background:#111620;
border:1px solid #252c38;
border-radius:18px;
padding:20px
}

.field{
margin-bottom:16px
}

label{
display:block;
font-size:14px;
font-weight:bold;
margin-bottom:7px
}

input,textarea{
width:100%;
background:#0b0f16;
border:1px solid #29313d;
border-radius:12px;
padding:14px;
font-size:15px;
color:#fff;
outline:none
}

input:focus,textarea:focus{
border-color:#7c5cff
}

textarea{
height:180px;
resize:vertical
}

.counter{
display:flex;
align-items:center;
justify-content:space-between;
background:#0b0f16;
border:1px solid #252c38;
border-radius:13px;
padding:13px 15px;
margin:18px 0
}

.counter-title{
font-size:12px;
color:#999
}

.counter-number{
font-size:27px;
font-weight:bold;
color:#9b85ff;
margin-top:3px
}

.counter-buttons{
display:flex;
gap:7px
}

.small-btn{
width:40px;
height:40px;
border:1px solid #303846;
background:#151b25;
color:#fff;
border-radius:10px;
font-size:21px;
cursor:pointer
}

.buttons{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px
}

.action{
border:0;
border-radius:12px;
padding:15px;
font-size:14px;
font-weight:bold;
color:#fff;
cursor:pointer
}

.send{
background:#7657e8
}

.copy{
background:#2563eb
}

.save{
background:#16835c
}

.clear{
background:#c53f55
}

.note{
margin-top:15px;
padding:13px;
border-radius:12px;
background:#0b0f16;
border:1px solid #252c38;
color:#999;
font-size:12px;
line-height:1.7
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
margin-top:12px
}

.stat{
text-align:center;
padding:12px 5px;
background:#0b0f16;
border:1px solid #252c38;
border-radius:11px
}

.stat b{
display:block;
font-size:16px;
margin-bottom:4px
}

.stat span{
font-size:10px;
color:#888
}

footer{
text-align:center;
color:#777;
font-size:12px;
padding-top:22px
}

.theme{
position:fixed;
left:15px;
bottom:15px;
width:44px;
height:44px;
border:1px solid #303846;
border-radius:50%;
background:#111620;
color:#fff;
font-size:18px;
cursor:pointer
}

.toast{
position:fixed;
bottom:70px;
right:50%;
transform:translateX(50%);
background:#161c27;
border:1px solid #303846;
color:#fff;
padding:11px 17px;
border-radius:10px;
font-size:13px;
display:none
}

.toast.show{
display:block
}

@media(max-width:550px){
.hero h1{
font-size:34px
}

.card{
padding:16px
}

.buttons{
grid-template-columns:1fr
}
}
</style>
</head>

<body>

<div class="top">
© 2026 علي رضا
</div>

<div class="container">

<div class="hero">
<h1>كبس كبس حبيبي</h1>
<p>جهّز رسالتك واضغط كبس كبس</p>
</div>

<div class="card">

<div class="field">
<label>📧 إيميل الدعم</label>
<input id="email" type="email" placeholder="example@domain.com">
</div>

<div class="field">
<label>📝 الموضوع</label>
<input id="subject" type="text" placeholder="اكتب الموضوع">
</div>

<div class="field">
<label>💬 النص</label>
<textarea id="message" placeholder="اكتب رسالتك هنا..."></textarea>
</div>

<div class="counter">
<div>
<div class="counter-title">عدد مرات الكبس</div>
<div class="counter-number" id="reportCount">0</div>
</div>

<div class="counter-buttons">
<button class="small-btn" id="minus">−</button>
<button class="small-btn" id="plus">+</button>
</div>
</div>

<div class="buttons">
<button class="action send" id="sendMail">🚀 كبس كبس</button>
<button class="action copy" id="copy">📋 نسخ</button>
<button class="action save" id="save">💾 حفظ</button>
<button class="action clear" id="clear">🗑️ مسح</button>
</div>

<div class="note">
البيانات محفوظة داخل المتصفح فقط. زر «كبس كبس» يفتح تطبيق البريد عندك مع تجهيز الرسالة، وأنت تضغط إرسال بنفسك.
</div>

<div class="stats">
<div class="stat">
<b id="chars">0</b>
<span>حرف</span>
</div>

<div class="stat">
<b id="words">0</b>
<span>كلمة</span>
</div>

<div class="stat">
<b id="state">جاهز</b>
<span>الحالة</span>
</div>
</div>

</div>

<footer>
© 2026 علي رضا
</footer>

</div>

<button class="theme" id="theme">☀️</button>

<div class="toast" id="toast"></div>

<script>
const email=document.getElementById("email");
const subject=document.getElementById("subject");
const message=document.getElementById("message");
const countEl=document.getElementById("reportCount");
const chars=document.getElementById("chars");
const words=document.getElementById("words");
const state=document.getElementById("state");
const toast=document.getElementById("toast");

let count=Number(localStorage.getItem("support_report_count")||0);

function showToast(text){
toast.textContent=text;
toast.classList.add("show");

setTimeout(()=>{
toast.classList.remove("show");
},1800);
}

function updateCounter(){
countEl.textContent=count;
localStorage.setItem("support_report_count",count);
}

function updateStats(){
const text=message.value.trim();

chars.textContent=message.value.length;
words.textContent=text ? text.split(/\s+/).length : 0;
}

function saveData(show=true){
localStorage.setItem("support_form_data",JSON.stringify({
email:email.value,
subject:subject.value,
message:message.value
}));

if(show) showToast("تم الحفظ ✓");
}

function loadData(){
try{
const data=JSON.parse(
localStorage.getItem("support_form_data")||"{}"
);

email.value=data.email||"";
subject.value=data.subject||"";
message.value=data.message||"";
}catch(e){}

updateCounter();
updateStats();
}

function buildMail(){
const to=email.value.trim();
const sub=subject.value.trim();
const msg=message.value.trim();

if(!to){
showToast("اكتب إيميل الدعم");
email.focus();
return null;
}

if(!msg){
showToast("اكتب نص الرسالة");
message.focus();
return null;
}

return "mailto:"+encodeURIComponent(to)+
"?subject="+encodeURIComponent(sub)+
"&body="+encodeURIComponent(msg);
}

document.getElementById("sendMail").onclick=()=>{
const mail=buildMail();

if(!mail)return;

saveData(false);

count++;
updateCounter();

state.textContent="تم الفتح";
showToast("تم فتح البريد");

setTimeout(()=>{
window.location.href=mail;
},150);
};

document.getElementById("copy").onclick=async()=>{
const text=
`الإيميل: ${email.value}
الموضوع: ${subject.value}

${message.value}`;

try{
await navigator.clipboard.writeText(text);
showToast("تم النسخ ✓");
}catch(e){
showToast("تعذر النسخ");
}
};

document.getElementById("save").onclick=()=>{
saveData();
state.textContent="محفوظ";
};

document.getElementById("clear").onclick=()=>{
email.value="";
subject.value="";
message.value="";

localStorage.removeItem("support_form_data");

updateStats();
state.textContent="جاهز";

showToast("تم المسح");
};

document.getElementById("plus").onclick=()=>{
count++;
updateCounter();
};

document.getElementById("minus").onclick=()=>{
if(count>0)count--;
updateCounter();
};

[email,subject,message].forEach(el=>{
el.addEventListener("input",()=>{
updateStats();
saveData(false);
state.textContent="محفوظ تلقائيًا";
});
});

const themeBtn=document.getElementById("theme");

function setTheme(mode){
if(mode==="light"){
document.body.style.background="#f2f4f8";
document.body.style.color="#111";
themeBtn.textContent="🌙";
}else{
document.body.style.background="#080b12";
document.body.style.color="#fff";
themeBtn.textContent="☀️";
}

localStorage.setItem("support_theme",mode);
}

themeBtn.onclick=()=>{
const light=localStorage.getItem("support_theme")==="light";
setTheme(light?"dark":"light");
};

setTheme(localStorage.getItem("support_theme")||"dark");
loadData();
</script>

</body>
               </html>
