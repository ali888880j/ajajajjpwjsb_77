<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#080b14">
<title>Support Center</title>

<style>
*{box-sizing:border-box}

:root{
  --bg:#070a12;
  --card:rgba(17,22,35,.78);
  --card2:rgba(25,31,48,.9);
  --text:#f5f7ff;
  --muted:#8f9ab0;
  --border:rgba(255,255,255,.09);
  --accent:#6c63ff;
  --accent2:#00d4ff;
  --danger:#ff5577;
  --success:#35d07f;
  --shadow:0 30px 90px rgba(0,0,0,.42);
}

body.light{
  --bg:#eef2f8;
  --card:rgba(255,255,255,.78);
  --card2:#fff;
  --text:#121826;
  --muted:#657083;
  --border:rgba(0,0,0,.09);
}

html{scroll-behavior:smooth}

body{
  margin:0;
  min-height:100vh;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 15% 10%,rgba(108,99,255,.18),transparent 30%),
    radial-gradient(circle at 85% 20%,rgba(0,212,255,.12),transparent 30%),
    var(--bg);
  overflow-x:hidden;
  transition:.3s;
}

button,input,textarea{font:inherit}

button{cursor:pointer}

.background{
  position:fixed;
  inset:0;
  overflow:hidden;
  pointer-events:none;
  z-index:-1;
}

.glow{
  position:absolute;
  width:420px;
  height:420px;
  border-radius:50%;
  filter:blur(100px);
  opacity:.16;
  background:var(--accent);
  animation:move 13s ease-in-out infinite alternate;
}

.glow.one{top:-180px;left:-120px}
.glow.two{
  right:-180px;
  bottom:-120px;
  background:var(--accent2);
  animation-delay:3s;
}

@keyframes move{
  from{transform:translate(0,0)}
  to{transform:translate(80px,50px) scale(1.12)}
}

.grid{
  position:absolute;
  inset:0;
  opacity:.05;
  background-image:
    linear-gradient(var(--text) 1px,transparent 1px),
    linear-gradient(90deg,var(--text) 1px,transparent 1px);
  background-size:45px 45px;
  mask-image:linear-gradient(to bottom,black,transparent);
}

header{
  position:sticky;
  top:0;
  z-index:20;
  border-bottom:1px solid var(--border);
  background:rgba(7,10,18,.62);
  backdrop-filter:blur(22px);
}

body.light header{
  background:rgba(238,242,248,.7);
}

.nav{
  width:min(1050px,calc(100% - 30px));
  height:70px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
  font-weight:800;
  letter-spacing:.2px;
}

.logo{
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  border-radius:14px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:0 12px 35px rgba(108,99,255,.3);
}

.actions{
  display:flex;
  gap:8px;
}

.icon{
  width:42px;
  height:42px;
  border-radius:13px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
}

main{
  width:min(900px,calc(100% - 24px));
  margin:auto;
}

.hero{
  text-align:center;
  padding:75px 0 30px;
}

.status{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:8px 13px;
  border-radius:30px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--success);
  font-size:13px;
  backdrop-filter:blur(15px);
}

.dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--success);
  box-shadow:0 0 14px var(--success);
}

h1{
  font-size:clamp(40px,8vw,68px);
  line-height:1;
  letter-spacing:-3px;
  margin:22px 0 15px;
}

.gradient{
  background:linear-gradient(90deg,var(--accent2),#fff,var(--accent));
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.hero p{
  color:var(--muted);
  max-width:650px;
  margin:auto;
  line-height:1.8;
  font-size:15px;
}

.panel{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:26px;
  padding:24px;
  backdrop-filter:blur(25px);
  box-shadow:var(--shadow);
}

.form-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.field{
  margin-bottom:17px;
}

label{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:8px;
  font-size:13px;
  color:var(--muted);
}

.optional{
  color:var(--accent2);
  font-size:11px;
}

input,textarea{
  width:100%;
  border:1px solid var(--border);
  outline:none;
  color:var(--text);
  background:rgba(0,0,0,.16);
  border-radius:15px;
  padding:14px 15px;
  transition:.2s;
}

body.light input,
body.light textarea{
  background:rgba(0,0,0,.035);
}

input:focus,textarea:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(108,99,255,.12);
}

textarea{
  min-height:230px;
  resize:vertical;
  line-height:1.7;
}

.counter{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:15px;
  margin-top:4px;
  border-radius:17px;
  background:rgba(108,99,255,.08);
  border:1px solid rgba(108,99,255,.15);
}

.counter-info{
  display:flex;
  align-items:center;
  gap:12px;
}

.counter-icon{
  width:43px;
  height:43px;
  display:grid;
  place-items:center;
  border-radius:13px;
  background:rgba(108,99,255,.14);
}

.counter strong{
  display:block;
  font-size:18px;
}

.counter small{
  color:var(--muted);
}

.counter-buttons{
  display:flex;
  gap:6px;
}

.small-btn{
  width:40px;
  height:40px;
  border-radius:12px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  font-size:18px;
}

.buttons{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
  margin-top:18px;
}

.primary,.secondary,.clear{
  border-radius:14px;
  padding:13px 18px;
  border:1px solid var(--border);
  transition:.2s;
}

.primary{
  color:white;
  background:linear-gradient(135deg,var(--accent),#5148d8);
  box-shadow:0 10px 25px rgba(108,99,255,.2);
}

.secondary{
  color:var(--text);
  background:var(--card);
}

.clear{
  color:#fff;
  background:rgba(255,85,119,.12);
  border-color:rgba(255,85,119,.2);
}

.primary:hover,.secondary:hover,.clear:hover,.small-btn:hover{
  transform:translateY(-2px);
}

.info{
  margin-top:15px;
  padding:13px 15px;
  border-radius:14px;
  background:rgba(0,212,255,.06);
  border:1px solid rgba(0,212,255,.12);
  color:var(--muted);
  font-size:12px;
  line-height:1.7;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin:15px 0 55px;
}

.stat{
  text-align:center;
  padding:17px;
  border-radius:18px;
  background:var(--card);
  border:1px solid var(--border);
}

.stat b{
  display:block;
  font-size:23px;
}

.stat span{
  color:var(--muted);
  font-size:12px;
}

footer{
  text-align:center;
  color:var(--muted);
  font-size:12px;
  padding:30px 15px;
  border-top:1px solid var(--border);
}

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translate(-50%,100px);
  opacity:0;
  padding:13px 18px;
  background:#121827;
  color:#fff;
  border-radius:14px;
  box-shadow:var(--shadow);
  transition:.3s;
  z-index:100;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

@media(max-width:650px){
  .form-row{grid-template-columns:1fr}
  .hero{padding-top:55px}
  .panel{padding:17px}
  .stats{grid-template-columns:1fr 1fr 1fr}
  .buttons button{flex:1 1 100%}
}

@media(max-width:400px){
  .stats{gap:7px}
  .stat{padding:13px 5px}
}
</style>
</head>

<body>

<div class="background">
  <div class="glow one"></div>
  <div class="glow two"></div>
  <div class="grid"></div>
</div>

<header>
  <nav class="nav">
    <div class="brand">
      <div class="logo">✦</div>
      <span>Support Center</span>
    </div>

    <div class="actions">
      <button class="icon" id="theme" title="تغيير المظهر">☀️</button>
    </div>
  </nav>
</header>

<main>

<section class="hero">
  <div class="status">
    <span class="dot"></span>
    Support Interface
  </div>

  <h1>
    مركز <span class="gradient">الدعم</span>
  </h1>

  <p>
    واجهة بسيطة واحترافية لتجهيز نص البلاغ وحفظه ونسخه بسهولة.
  </p>
</section>

<section class="panel">

  <div class="form-row">

    <div class="field">
      <label>
        <span>إيميل الدعم</span>
        <span class="optional">اختياري</span>
      </label>

      <input
        id="email"
        type="email"
        placeholder="example@domain.com"
        autocomplete="email"
      >
    </div>

    <div class="field">
      <label>
        <span>الموضوع</span>
        <span class="optional">مطلوب</span>
      </label>

      <input
        id="subject"
        type="text"
        placeholder="موضوع البلاغ"
      >
    </div>

  </div>

  <div class="field">
    <label>
      <span>نص البلاغ</span>
      <span id="length">0 حرف</span>
    </label>

    <textarea
      id="message"
      placeholder="اكتب نص البلاغ هنا..."
    ></textarea>
  </div>

  <div class="counter">

    <div class="counter-info">
      <div class="counter-icon">📨</div>

      <div>
        <strong id="count">0</strong>
        <small>بلاغات تم تسجيلها</small>
      </div>
    </div>

    <div class="counter-buttons">
      <button class="small-btn" id="minus">−</button>
      <button class="small-btn" id="plus">+</button>
    </div>

  </div>

  <div class="buttons">
    <button class="primary" id="copy">
      📋 نسخ البلاغ
    </button>

    <button class="secondary" id="save">
      💾 حفظ
    </button>

    <button class="clear" id="clear">
      🗑️ مسح
    </button>
  </div>

  <div class="info">
    🔒 البيانات يتم حفظها محليًا في متصفحك فقط، ولا يتم إرسالها إلى أي خادم من خلال هذه الصفحة.
  </div>

</section>

<section class="stats">

  <div class="stat">
    <b id="chars">0</b>
    <span>الحروف</span>
  </div>

  <div class="stat">
    <b id="words">0</b>
    <span>الكلمات</span>
  </div>

  <div class="stat">
    <b id="status">جاهز</b>
    <span>الحالة</span>
  </div>

</section>

</main>

<footer>
  © 2026 علي رضا
  <br>
  Support Interface
</footer>

<div class="toast" id="toast"></div>

<script>
const email=document.getElementById("email");
const subject=document.getElementById("subject");
const message=document.getElementById("message");

const countEl=document.getElementById("count");
const lengthEl=document.getElementById("length");
const charsEl=document.getElementById("chars");
const wordsEl=document.getElementById("words");
const statusEl=document.getElementById("status");
const toast=document.getElementById("toast");

let count=Number(localStorage.getItem("support_count")||0);

function showToast(text){
  toast.textContent=text;
  toast.classList.add("show");

  setTimeout(()=>{
    toast.classList.remove("show");
  },2200);
}

function updateCount(){
  count=Math.max(0,count);
  countEl.textContent=count;
  localStorage.setItem("support_count",count);
}

function updateText(){
  const text=message.value;

  const chars=text.length;
  const words=text.trim()
    ? text.trim().split(/\s+/).length
    : 0;

  lengthEl.textContent=chars+" حرف";
  charsEl.textContent=chars;
  wordsEl.textContent=words;

  statusEl.textContent=text.trim()
    ?"جاهز"
    :"بانتظار النص";
}

function saveData(){
  const data={
    email:email.value,
    subject:subject.value,
    message:message.value
  };

  localStorage.setItem("support_data",JSON.stringify(data));
  showToast("تم حفظ البيانات ✓");
}

function loadData(){
  try{
    const data=JSON.parse(
      localStorage.getItem("support_data")||"null"
    );

    if(!data)return;

    email.value=data.email||"";
    subject.value=data.subject||"";
    message.value=data.message||"";
  }catch(e){}
}

function clearData(){
  email.value="";
  subject.value="";
  message.value="";

  localStorage.removeItem("support_data");

  updateText();
  showToast("تم مسح البيانات");
}

async function copyReport(){

  const e=email.value.trim();
  const s=subject.value.trim();
  const m=message.value.trim();

  if(!s && !m){
    showToast("أدخل الموضوع أو نص البلاغ أولًا");
    return;
  }

  let output="";

  if(e){
    output+="Email: "+e+"\n";
  }

  if(s){
    output+="Subject: "+s+"\n";
  }

  output+="\n"+m;

  try{
    await navigator.clipboard.writeText(output);

    count++;
    updateCount();

    showToast("تم نسخ البلاغ وتسجيله ✓");
  }catch(err){
    showToast("تعذر النسخ من المتصفح");
  }
}

document.getElementById("plus").onclick=()=>{
  count++;
  updateCount();
  showToast("تمت إضافة بلاغ");
};

document.getElementById("minus").onclick=()=>{
  if(count>0)count--;
  updateCount();
};

document.getElementById("copy").onclick=copyReport;
document.getElementById("save").onclick=saveData;
document.getElementById("clear").onclick=clearData;

message.addEventListener("input",updateText);
subject.addEventListener("input",updateText);

const theme=document.getElementById("theme");

function setTheme(mode){
  if(mode==="light"){
    document.body.classList.add("light");
    theme.textContent="🌙";
  }else{
    document.body.classList.remove("light");
    theme.textContent="☀️";
  }

  localStorage.setItem("support_theme",mode);
}

theme.onclick=()=>{
  const light=document.body.classList.contains("light");
  setTheme(light?"dark":"light");
};

const savedTheme=localStorage.getItem("support_theme")||"dark";
setTheme(savedTheme);

loadData();
updateCount();
updateText();
</script>

</body>
     </html>
